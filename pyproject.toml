[project]
name = "realtime-yolo-hand-detection-app"
version = "1.0.0"
description = "End-to-end real-time hand finger-number (1-5) detection using YOLO11s, FastAPI REST/WebSocket, Web UI, Streamlit client, and MediaPipe baseline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_model: integration tests that require the trained weights/best.pt checkpoint",
]
